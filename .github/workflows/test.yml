name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  # The toolkit has files behind unix and windows build tags, and an arm64
  # runner is where an alignment or a syscall assumption shows up, so the
  # extra rows are worth paying for on every pull request rather than finding
  # out from a report.
  #
  # darwin/amd64 is missing on purpose. The only hosted runner for it is
  # macos-13, which GitHub is retiring, and it queued for more than ten
  # minutes on both of the runs that introduced this file. A row that holds
  # every pull request open for a quarter of an hour gets ignored, and an
  # ignored check is worse than an absent one. It is compiled in the cross
  # job below instead, so a build failure is still caught. Tests are not run
  # there, and that is the honest version of what this covers.
  test:
    name: Test (Go ${{ matrix.go }} · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]
        os:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-latest # darwin/arm64
          - windows-latest # windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race -covermode=atomic -coverprofile=${{ runner.temp }}/coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage.out
          fail_ci_if_error: false

  # Formatting and vet run once. There is no reason to pay for them five times,
  # and neither one is going to disagree across operating systems.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  # A build tag that is wrong compiles fine on the machine you wrote it on.
  # This job builds for platforms the matrix does not run on, which is cheap,
  # since it compiles without linking or testing.
  cross:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: riscv64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: arm64 }
          - { goos: js, goarch: wasm }
          - { goos: wasip1, goarch: wasm }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build for ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: go build ./...

  # Go 1.27 builds encoding/json/v2 by default and still lets anyone turn it
  # off, so mizu carries both and json_v1.go is what compiles when it is off.
  # The matrix above only ever exercises the default, which means the other file
  # would rot without this job, and the tests that hold the two to the same
  # behaviour would only ever check one of them.
  #
  # It is one row rather than a second axis on the matrix. The difference is in
  # two files and none of it is platform specific, so paying for it four more
  # times buys nothing.
  json:
    name: JSON v1
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: nojsonv2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # The same commit built on four different machines produces the same bytes,
  # or the release is not something anybody can check.
  #
  # Every row builds linux/amd64 whatever it is running on, because a binary
  # for one target is what two people are comparing when they want to know
  # whether the download matches the source. The host is the variable: four
  # operating systems, two architectures, four workspace paths, and four
  # module caches in whatever state the runner left them. A build that only
  # reproduces on a cold cache is not reproducible either, so nothing here
  # clears one.
  #
  # This is a matrix and a comparison rather than one job building twice
  # because building twice on one machine passes whether or not -trimpath is
  # doing anything, and a check that passes either way is not a check.
  build:
    name: Reproducible build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux/amd64
          - ubuntu-24.04-arm # linux/arm64
          - macos-latest # darwin/arm64
          - windows-latest # windows/amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      # The output goes in the workspace rather than under RUNNER_TEMP, which
      # is the one path in this job that is spelled differently on Windows.
      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o mizu.build ./cmd/mizu

      - uses: actions/upload-artifact@v5
        with:
          name: mizu-${{ matrix.os }}
          path: mizu.build
          retention-days: 1

  reproducible:
    name: Reproducible build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: builds

      - name: Compare
        run: |
          sha256sum builds/*/mizu.build
          if [ "$(sha256sum builds/*/mizu.build | cut -d' ' -f1 | sort -u | wc -l)" != 1 ]; then
            echo
            echo "the builds differ, so the same commit does not produce the same binary everywhere"
            exit 1
          fi

      # The comparison is of bytes, and bytes that agree on something that does
      # not run are not worth much.
      - name: Show what the binary says about itself
        run: |
          chmod +x builds/mizu-ubuntu-latest/mizu.build
          builds/mizu-ubuntu-latest/mizu.build version --json

  # tools/milestonebot is a nested module, so `go test ./...` at the root does
  # not reach it. It runs the label file through its own validator, which is
  # why a broken .github/labels.yml fails here rather than on the push to main
  # that would have synced it.
  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: tools/milestonebot/go.sum

      - name: Check formatting
        working-directory: tools/milestonebot
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: tools/milestonebot
        run: go vet ./...

      - name: Test
        working-directory: tools/milestonebot
        run: go test ./...

  # examples/standalone is the standalone claim compiled. It is a module of its
  # own on purpose, because the point of it is the go.mod: one requirement, the
  # one somebody adopting a single package would add. A module that shared the
  # root's go.mod would build no matter what the packages had grown.
  #
  # The rules about what the examples may import are Go tests at the root, in
  # standalone_test.go, so they run in the matrix above. This job is the part
  # those tests cannot do, which is compiling the programs.
  examples:
    name: Standalone examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: examples/standalone/go.sum

      - name: Check formatting
        working-directory: examples/standalone
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # The same reasoning as bench below: this module reaches the toolkit
      # through a replace, so a dependency added next door lands in this go.sum
      # too, and the failure without this step reads as a broken runner.
      - name: go.mod and go.sum are up to date
        working-directory: examples/standalone
        run: go mod tidy -diff

      - name: Vet
        working-directory: examples/standalone
        run: go vet ./...

      - name: Build
        working-directory: examples/standalone
        run: go build ./...

  # bench is a nested module too, for the same reason: it loads Go packages with
  # golang.org/x/tools, and nothing a user installs should carry that.
  #
  # No numbers are recorded here. A hosted runner is a shared machine and its
  # timings move by a factor of two between runs, so a threshold on one would
  # fail for reasons that have nothing to do with the commit. What this job
  # protects is the part that a noisy machine cannot lie about: that the
  # benchmarks compile and run, that every budgeted operation still has a
  # benchmark reporting the name its row is filed under, and that none of them
  # has picked up a habit that makes two runs stop being comparable.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: bench/go.sum

      - name: Check formatting
        working-directory: bench
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      # bench depends on the toolkit through a replace, so a dependency added
      # next door lands in this module's go.sum too. Without this the failure
      # is a missing go.sum entry three steps later, which reads as a broken
      # runner rather than as a file somebody has to update.
      - name: go.mod and go.sum are up to date
        working-directory: bench
        run: go mod tidy -diff

      - name: Vet
        working-directory: bench
        run: go vet ./...

      - name: Test
        working-directory: bench
        run: go test ./...

      - name: Every budgeted operation is measured
        working-directory: bench
        run: go run ./cmd/benchrun check

      - name: The benchmarks follow the rules
        working-directory: bench
        run: go run ./cmd/benchrun lint
