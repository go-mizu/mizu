name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test (Go ${{ matrix.go }} · ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -race -covermode=atomic -coverprofile=${{ runner.temp }}/coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/coverage.out
          fail_ci_if_error: false

  # tools/milestonebot is a nested module, so `go test ./...` at the root does
  # not reach it. It runs the label file through its own validator, which is
  # why a broken .github/labels.yml fails here rather than on the push to main
  # that would have synced it.
  tools:
    name: Tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: tools/milestonebot/go.sum

      - name: Check formatting
        working-directory: tools/milestonebot
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: tools/milestonebot
        run: go vet ./...

      - name: Test
        working-directory: tools/milestonebot
        run: go test ./...
